# Vigilancia de dependencias.
#
# Complementa a `pip-audit`, que corre en cada PR y solo mira vulnerabilidades
# conocidas de lo que ya está fijado. Dependabot avisa además de las versiones
# nuevas, incluidas las que cierran un fallo antes de que tenga CVE público.
#
# Frecuencia mensual a propósito: son nueve dependencias de runtime y bien
# fijadas. Un PR semanal por cada una sería ruido que nadie mira, y una alerta
# que nadie mira es peor que no tenerla.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    target-branch: "Desarrollo"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencias"
    groups:
      # Parches Y versiones menores en un solo PR.
      #
      # Hasta el 09/09/2026 solo se agrupaban los parches, y el resultado fue
      # que la primera tanda abrió **siete PR de golpe** —cinco de pip y dos de
      # actions— que se quedaron dos días colgando. Un repositorio con siete PR
      # abiertos le dice a quien llega de fuera que esto está desatendido, y
      # nadie revisa siete cosas a la vez: se mergean en bloque sin mirar, que
      # es justo lo que esta vigilancia venía a evitar.
      #
      # Las MAYORES se dejan fuera del grupo a propósito: cada una llega en su
      # propio PR porque puede cambiar comportamiento y merece leerse sola. El
      # ejemplo está fresco: `django-axes` 7 → 8 es la pieza que decide quién
      # entra al panel del médico, y su verde no valía nada hasta que hubo una
      # prueba que fijara ese comportamiento (ficha D24).
      rutina:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "Desarrollo"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencias"
    groups:
      # Mismo criterio que arriba, y aquí importa más: las actions se actualizan
      # a menudo y son de bajo riesgo, así que de una en una son puro ruido.
      acciones:
        update-types:
          - "patch"
          - "minor"
          - "major"
