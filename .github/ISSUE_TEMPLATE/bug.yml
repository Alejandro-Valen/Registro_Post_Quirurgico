name: Fallo del sistema
description: Algo no funciona como debería
labels: ["fallo"]
body:
  - type: markdown
    attributes:
      value: |
        **Si el fallo expone datos de un paciente o compromete la seguridad, no
        lo reportes aquí.** Ver [SECURITY.md](../blob/Desarrollo/SECURITY.md).

  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué hace el sistema, y qué esperabas que hiciera.
    validations:
      required: true

  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: |
        Los pasos exactos. Si va con datos, usa los de `seed_demo` — nunca los
        de un paciente real, ni siquiera parciales.
      placeholder: |
        1. python manage.py seed_demo
        2. Entrar al panel como demo_medico
        3. ...
    validations:
      required: true

  - type: dropdown
    id: alcance
    attributes:
      label: Qué toca
      options:
        - Motor de alertas (clasificación clínica)
        - Bot de WhatsApp (conversación con el paciente)
        - Panel del médico
        - Tareas programadas / correo
        - Portal público
        - Despliegue o configuración
        - Otro / no estoy seguro
    validations:
      required: true

  - type: checkboxes
    id: clinico
    attributes:
      label: Impacto clínico
      options:
        - label: Puede hacer que una alerta **no llegue** al médico
        - label: Puede hacer que se genere una alerta **que no corresponde**
        - label: Puede hacer que se **pierda** telemetría de un paciente
        - label: Ninguno de los anteriores

  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      placeholder: |
        Python / Django / sistema operativo, y si fue en local o en despliegue.
