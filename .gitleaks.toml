# Guardia de secretos — configuracion de gitleaks
#
# Por que existe. El repositorio recibe trabajo desde dos herramientas que no
# comparten memoria (Claude Code y Codex CLI) y desde dos maquinas distintas.
# El `.env` nunca se subio —eso se hizo bien desde el Sprint 0— pero esa
# garantia hoy depende de que nadie se equivoque una sola vez. Esto la vuelve
# automatica: un secreto que entre en un commit rompe la CI del PR.
#
# Se ejecuta sobre la historia completa, no solo sobre el diff. Son ~292
# commits y tarda alrededor de un segundo: no hay razon para mirar menos.

[extend]
# Las ~170 reglas que trae gitleaks de fabrica (AWS, Twilio, SendGrid, Stripe,
# tokens de GitHub, claves privadas...). La regla de abajo se suma a esas, no
# las reemplaza.
useDefault = true


# --- Regla propia: SECRET_KEY de Django escrita en el codigo ---------------
#
# gitleaks de fabrica NO detecta esto, y es precisamente el error que este
# proyecto ya cometio: la clave que `django-admin startproject` genera quedo
# literal en `settings.py` durante el Sprint 0 y sigue en la historia (ver
# `.gitleaksignore`, donde se explica por que hoy es inofensiva).
#
# Hoy `settings.py` la lee con `config_obligatoria('SECRET_KEY')` y no hay
# ningun valor por defecto: si alguien vuelve a escribirla a mano, esto lo
# detiene en el PR.
[[rules]]
id = "django-secret-key-literal"
description = "SECRET_KEY de Django escrita literalmente en vez de leerse del entorno"
regex = '''(?i)SECRET_KEY\s*[:=]\s*['"][^'"\n]{20,}['"]'''
tags = ["django", "clave", "propia-del-proyecto"]

[rules.allowlist]
# Lo que NO es un hallazgo:
regexes = [
    # La forma correcta: leerla del entorno.
    '''SECRET_KEY\s*=\s*config''',
    '''SECRET_KEY\s*=\s*os\.environ''',
    # Los valores de relleno de la CI y del .env.example, que son publicos a
    # proposito y no abren nada.
    '''ci-clave-de-relleno''',
    '''<[^>]*>''',
]


# --- Regla propia: numero de cedula colombiana ----------------------------
#
# Por que existe. El 07/09/2026 una auditoria encontro el nombre completo del
# medico proponente, su numero de cedula y sus afiliaciones institucionales en
# `docs/auditoria_literatura/`. Llegaron al repositorio al cargar un documento
# que el propio medico proporciono para alimentar el contexto del proyecto.
#
# Lo grave no fue el dato: fue que la carpeta estaba EXCLUIDA del escaneo (ver
# abajo), asi que esta guardia nunca la iba a mirar. Ficha D17.
#
# La regla se ancla a la palabra "cedula" y no a cualquier numero: un patron
# suelto de 6-10 digitos produciria un falso positivo con cada fecha, cada
# puerto y cada cifra de la documentacion.
[[rules]]
id = "cedula-colombiana"
description = "Numero de cedula junto a la palabra que lo nombra"
regex = '''(?i)c[eé]dula\D{0,12}\d{6,10}'''
tags = ["pii", "habeas-data", "propia-del-proyecto"]

[rules.allowlist]
regexes = [
    # La declaracion del campo en el modelo, que no lleva ningun valor.
    '''cedula\s*=\s*models\.''',
    # Los <corchetes> de las plantillas.
    '''<[^>]*>''',
]
paths = [
    # Datos de PRUEBA y de demostracion. Son inventados por definicion
    # (`123456789`, `999888777`, `FILTRO-0001`) y meterlos aqui evita que la
    # guardia grite en cada fixture. Que un dato REAL de paciente no entre en
    # una prueba es una regla distinta —esta escrita en D11— y no se defiende
    # desde aqui: se defiende no poniendolo.
    '''.*/tests/.*''',
    '''.*/seed_demo.*\.py$''',
]


# --- Rutas que no se escanean ---------------------------------------------
[allowlist]
description = "Rutas sin secretos por naturaleza"
paths = [
    # NOTA (07/09/2026, ficha D17): aqui estaba `docs/auditoria_literatura/.*`.
    # Se retiro. La exclusion era un aplazamiento declarado al "Loop G" de
    # higiene de identidad, un loop que nunca se ejecuto — y mientras tanto esa
    # carpeta fue la unica del repositorio sin vigilancia, justo la que tenia
    # datos personales de un tercero. Una excepcion que espera a un trabajo
    # futuro deja de ser una excepcion y pasa a ser un agujero.
    #
    # Bytecode y estaticos generados.
    '''.*\.pyc$''',
    '''staticfiles/.*''',
]
